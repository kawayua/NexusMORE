name: Public product checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: '3.13'
      - run: python -m pip install -e ".[dev,workflow,dsh]"
      - run: python -m scripts.check_public_repository
      - run: python -m pytest -q
