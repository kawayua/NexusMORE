[build-system]
requires = ["setuptools>=81"]
build-backend = "setuptools.build_meta"

[project]
name = "nexusmore"
version = "0.1.0.dev0"
description = "枢模 · NexusMORE mathematical modeling workflow runtime"
license = "AGPL-3.0-only"
license-files = ["LICENSE", "THIRD_PARTY_NOTICES.md", "docs/licenses/Apache-2.0.txt", "docs/combined-distribution-license.md"]
requires-python = ">=3.13,<3.14"
dependencies = ["jsonschema>=4.26,<5"]
# Private F2 development distribution; F1 scope accepted, F5 licensing/public release still pending.
classifiers = ["Private :: Do Not Upload"]

[project.optional-dependencies]
figures = ["matplotlib==3.10.3", "numpy==2.3.1", "openpyxl==3.1.5", "Pillow==12.2.0", "PyMuPDF==1.27.2.3", "pypdf==6.16.1"]
workflow = ["anyio==4.14.2", "beautifulsoup4==4.15.0", "httpx==0.28.1", "jsonschema==4.26.0", "langgraph-checkpoint-postgres==3.2.0", "langgraph-checkpoint==4.3.1", "langgraph==1.2.10", "mcp==1.30.0", "numpy==2.3.1", "openpyxl==3.1.5", "Pillow==12.2.0", "portalocker==4.4.2", "psycopg[binary]==3.3.4", "pydantic==2.13.4", "pypdf==6.16.1", "qdrant-client==1.20.0", "scipy==1.16.0", "sympy==1.13.1"]
retrieval = ["anyio==4.14.2", "beautifulsoup4==4.15.0", "fastapi==0.162.0", "httpx==0.28.1", "jsonschema==4.26.0", "langgraph-checkpoint-postgres==3.2.0", "langgraph-checkpoint==4.3.1", "langgraph==1.2.10", "mcp==1.30.0", "numpy==2.3.1", "openpyxl==3.1.5", "Pillow==12.2.0", "portalocker==4.4.2", "psycopg[binary]==3.3.4", "pydantic==2.13.4", "pypdf==6.16.1", "qdrant-client==1.20.0", "sentence-transformers==6.0.0", "uvicorn==0.52.1"]
documents = ["defusedxml==0.7.1", "lxml==6.1.1", "openpyxl==3.1.5", "pdfplumber==0.11.10", "PyMuPDF==1.27.2.3", "pypdf==6.16.1", "python-docx==1.2.0"]
paper = ["anyio==4.14.2", "beautifulsoup4==4.15.0", "defusedxml==0.7.1", "fastapi==0.162.0", "httpx==0.28.1", "jsonschema==4.26.0", "langgraph-checkpoint-postgres==3.2.0", "langgraph-checkpoint==4.3.1", "langgraph==1.2.10", "lxml==6.1.1", "matplotlib==3.10.3", "mcp==1.30.0", "numpy==2.3.1", "openpyxl==3.1.5", "pdfplumber==0.11.10", "Pillow==12.2.0", "portalocker==4.4.2", "psycopg[binary]==3.3.4", "pydantic==2.13.4", "PyMuPDF==1.27.2.3", "pypdf==6.16.1", "python-docx==1.2.0", "qdrant-client==1.20.0", "scipy==1.16.0", "sentence-transformers==6.0.0", "sympy==1.13.1", "uvicorn==0.52.1"]
evidence = ["numpy==2.3.1", "openpyxl==3.1.5", "pydantic==2.13.4", "scipy==1.16.0", "sympy==1.13.1"]
dev = ["build>=1.2", "pytest==9.0.3", "setuptools>=81"]

[project.scripts]
modelcrew = "modelcrew.__main__:main"

[tool.setuptools]
package-dir = {"" = "src"}
include-package-data = false

[tool.setuptools.packages.find]
where = ["src"]
include = ["modelcrew"]
namespaces = false

